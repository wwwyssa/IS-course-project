<rect x="1511.0" y="1097.0" width="118.0" height="46" fill="white"/>
<text x="1570" y="1115.0" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Включает · M:N</text>
<text x="1570" y="1134.0" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Количество</text>
<text x="47" y="1300.0" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Сплошная линия — связь внутри одного сервиса; пунктир — межсервисная связь. 1 — ровно один; 0..1 — не более одного; 0..N — любое количество.</text>
<text x="47" y="1318.2" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Связь «Бронирование — Услуга» имеет кратность M:N и атрибут «Количество»; в даталогической модели ей соответствует booking_services.</text>
<text x="47" y="1336.4" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Файл относится к одной медицинской карте; связь файла с ежедневным отчётом необязательна (0..1). Карта и отчёт могут иметь 0..N файлов.</text>
<text x="47" y="1354.6" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Технические идентификаторы и типы SQL заменены сущностями, связями и содержательными атрибутами. time_pay сохранён без уточнения его смысла.</text>
</svg>